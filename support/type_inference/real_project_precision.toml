schema_version = 1
name = "Ruby Fast LSP reviewed real-project type precision"
corpus_revision = "real-project-1"
review_date = "2026-08-11"
minimum_projects = 5
minimum_cases = 12
notes = "Pinned reductions from Rails, RSpec Core, Sinatra, Minitest, and Cucumber Ruby. Exact-type cases verify concrete proofs; diagnostic cases are reviewed single-error mutations of an upstream call shape; suppression cases verify that incomplete dynamic evidence never becomes a false-positive type diagnostic. Cases are unweighted and do not increase the 100-point inference score."

