[[cases]]
id = "rails_numeric_boolean_returns"
project = "rails"
expectation = "concrete_type"
source_path = "activesupport/lib/active_support/core_ext/object/blank.rb"
source_lines = "197-212"
source_url = "https://github.com/rails/rails/blob/f78cc5d12551e21262c96be59211ec16550c0e28/activesupport/lib/active_support/core_ext/object/blank.rb#L197-L212"
reduction = "Retain the Numeric blank?/present? literal method bodies and remove documentation only."
rationale = "Literal boolean bodies prove exact method returns without relying on Rails runtime behavior."

[[cases.files]]
path = "rails_numeric.rb"
fixture = '''
class Numeric
  def blank?<hint label=" -> FalseClass">
    false
  end

  def present?<hint label=" -> TrueClass">
    true
  end
end
'''

[[cases]]
id = "rails_concern_dynamic_constant_result_is_not_diagnosed"
project = "rails"
expectation = "diagnostic_suppression"
source_path = "activesupport/lib/active_support/concern.rb"
source_lines = "223-229"
source_url = "https://github.com/rails/rails/blob/f78cc5d12551e21262c96be59211ec16550c0e28/activesupport/lib/active_support/concern.rb#L223-L229"
reduction = "Retain class_methods and its const_defined?/const_get/const_set conditional; define the surrounding module locally."
rationale = "The dynamically selected constant value is incomplete static evidence, so module_eval must remain diagnostic-free rather than borrowing a guessed receiver type."

[[cases.files]]
path = "rails_concern.rb"
fixture = '''
module ConcernReduction
  def class_methods(&class_methods_module_definition)
    mod = const_defined?(:ClassMethods, false) ?
      const_get(:ClassMethods) :
      const_set(:ClassMethods, Module.new)

    <warn none code="unresolved-method">mod.module_eval(&class_methods_module_definition)</warn>
  end
end
'''

[[cases]]
id = "rails_concern_extra_argument_is_proven"
project = "rails"
expectation = "diagnostic"
source_path = "activesupport/lib/active_support/concern.rb"
source_lines = "223-229"
source_url = "https://github.com/rails/rails/blob/f78cc5d12551e21262c96be59211ec16550c0e28/activesupport/lib/active_support/concern.rb#L223-L229"
reduction = "Retain the upstream zero-positional-parameter signature and mutate one call by adding a positional argument."
rationale = "The declaration and call shape are complete, so the single extra positional argument proves wrong-arity."

[[cases.files]]
path = "rails_concern_arity.rb"
fixture = '''
class ConcernReduction
  def self.class_methods(&block)
    block
  end
end

ConcernReduction.<warn code="wrong-arity">class_methods</warn>(:unexpected)
'''

[[cases]]
id = "rspec_memoized_branch_is_exhaustive_union"
project = "rspec-core"
expectation = "concrete_type"
source_path = "lib/rspec/core/memoized_helpers.rb"
source_lines = "141-147"
source_url = "https://github.com/rspec/rspec-core/blob/aec5f49485d97908183dbe790a7fefb8baaa8091/lib/rspec/core/memoized_helpers.rb#L141-L147"
reduction = "Flatten namespaces and replace RSpec.configuration.threadsafe? with an unknown boolean parameter while preserving both constructor branches and the instance-variable write."
rationale = "Both reachable branches construct known classes, so the result is their exhaustive normalized union."

[[cases.files]]
path = "rspec_memoized.rb"
fixture = '''
class ThreadsafeMemoized
end

class NonThreadSafeMemoized
end

class MemoizedHelpers
  def initialize_memoized(threadsafe)
    @memoized = if threadsafe
                  ThreadsafeMemoized.new
                else
                  NonThreadSafeMemoized.new
                end
    @memoized<hover label="(NonThreadSafeMemoized | ThreadsafeMemoized)">
  end
end
'''

[[cases]]
id = "rspec_dynamic_constant_receiver_is_not_diagnosed"
project = "rspec-core"
expectation = "diagnostic_suppression"
source_path = "lib/rspec/core/memoized_helpers.rb"
source_lines = "570-576"
source_url = "https://github.com/rspec/rspec-core/blob/aec5f49485d97908183dbe790a7fefb8baaa8091/lib/rspec/core/memoized_helpers.rb#L570-L576"
reduction = "Retain get_constant_or_yield and its dynamic example_group receiver; omit compatibility comments."
rationale = "An unannotated parameter does not prove a receiver lookup chain, so its reflection calls cannot produce unresolved-method diagnostics."

[[cases.files]]
path = "rspec_constant.rb"
fixture = '''
module MemoizedHelpers
  def self.get_constant_or_yield(example_group, name)
    if <warn none code="unresolved-method">example_group.const_defined?(name, false)</warn>
      <warn none code="unresolved-method">example_group.const_get(name, false)</warn>
    else
      yield
    end
  end
end
'''

[[cases]]
id = "rspec_get_constant_missing_name_is_proven"
project = "rspec-core"
expectation = "diagnostic"
source_path = "lib/rspec/core/memoized_helpers.rb"
source_lines = "570-576"
source_url = "https://github.com/rspec/rspec-core/blob/aec5f49485d97908183dbe790a7fefb8baaa8091/lib/rspec/core/memoized_helpers.rb#L570-L576"
reduction = "Retain the two-required-parameter signature and mutate one call by omitting name."
rationale = "The static module method identity and positional signature prove the missing argument."

[[cases.files]]
path = "rspec_constant_arity.rb"
fixture = '''
module MemoizedHelpers
  def self.get_constant_or_yield(example_group, name)
    [example_group, name]
  end
end

MemoizedHelpers.<warn code="wrong-arity">get_constant_or_yield</warn>(Object.new)
'''

