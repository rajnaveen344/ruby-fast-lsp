[[cases]]
id = "minitest_dynamic_memo_store_is_not_diagnosed"
project = "minitest"
expectation = "diagnostic_suppression"
source_path = "lib/minitest/spec.rb"
source_lines = "224-236"
source_url = "https://github.com/minitest/minitest/blob/581e7d5386def72040e49b036ba49e36e9cb14df/lib/minitest/spec.rb#L224-L236"
reduction = "Retain let's generated method and dynamic @_memoized fetch/write body; omit name validation."
rationale = "The memo store is runtime-initialized and unproven in this slice, so calls on it must remain Unknown without unresolved-method diagnostics."

[[cases.files]]
path = "minitest_let.rb"
fixture = '''
class MinitestSpec
  def self.let(name, &block)
    define_method(name) do
      <warn none code="unresolved-method">@_memoized.fetch(name) { |key| @_memoized[key] = instance_eval(&block) }</warn>
    end
  end
end
'''

