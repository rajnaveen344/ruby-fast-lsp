[[cases]]
id = "sinatra_get_options_hash_shape_is_valid"
project = "sinatra"
expectation = "diagnostic_suppression"
source_path = "lib/sinatra/base.rb"
source_lines = "1529-1537"
source_url = "https://github.com/sinatra/sinatra/blob/cb22afd7902b566b6eaba6c4ea89739494a65d12/lib/sinatra/base.rb#L1529-L1537"
reduction = "Retain get(path, opts = {}, &block), its route calls, and a minimal route declaration."
rationale = "The optional positional options hash and forwarded block are a complete valid call shape."

[[cases.files]]
path = "sinatra_get.rb"
fixture = '''
class SinatraBase
  def self.route(verb, path, options = {}, &block)
    [verb, path, options, block]
  end

  def self.get(path, opts = {}, &block)
    <warn none code="wrong-arity">route("GET", path, opts, &block)</warn>
    <warn none code="wrong-arity">route("HEAD", path, opts, &block)</warn>
  end
end

<warn none code="wrong-arity">SinatraBase.get("/", { auth: true }) { "ok" }</warn>
'''

