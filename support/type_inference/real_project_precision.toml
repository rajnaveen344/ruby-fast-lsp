[[cases.files]]
path = "cucumber_step.rb"
fixture = '''
module CucumberDsl
  def self.register(regexp, proc_or_sym, options = {})
    [regexp, proc_or_sym, options]
  end

  def register_rb_step_definition(regexp, symbol = nil, options = {}, &proc)
    proc_or_sym = symbol || proc
    <warn none code="wrong-arity">CucumberDsl.register(regexp, proc_or_sym, options)</warn>
  end
end
'''

