schema_version = 1
name = "Ruby Fast LSP type inference conformance"
corpus_revision = "m0-seed-15"
score_eligible = false
target_score = 90
critical_category_minimum = 85
minimum_cases_for_claim = 50
notes = "M0 seed corpus with 77 reviewed cases. Proven multiline chained-call inlays, source-ordered owner isolation, exact nonlocal-read and call-expression proof outcomes, deferred complete-graph finalization, exhaustive reopened-call unions, visibility-complete explicit dispatch, cross-file recursive return components, Unknown reassignment invalidation, and fail-closed unresolved or inaccessible chains are covered. Differential CLI/LSP parity covers method returns, parameters, constants, local and nonlocal variable assignments, concrete and explained-Unknown variable reads and calls, proven chain expressions, deferred mixin dispatch, reopened implicit/explicit dispatch, and cross-file recursive calls. Differential CLI/LSP diagnostic parity now covers unresolved-method with suggestions, unresolved-constant, missing-kwarg, unmatched YARD parameters, YARD/RBS return conflicts, unresolved require, parser syntax errors, and deterministic multi-diagnostic order; the measured score is diagnostic only until real-project reductions, representative diagnostic precision, and full performance baselines are complete."

[[categories]]
id = "literals_collections"
title = "Literals, operators, interpolations, and collections"
points = 10
critical = true

[[categories]]
id = "locals_scopes_attributes"
title = "Locals, assignments, scopes, captured variables, and attributes"
points = 10
critical = true

[[categories]]
id = "flow"
title = "Branches, guards, pattern matching, rescue, loops, and reachability"
points = 15
critical = true

[[categories]]
id = "calls_dispatch"
title = "Calls, constructors, dispatch, visibility, MRO, mixins, and super"
points = 15
critical = true

[[categories]]
id = "methods_blocks"
title = "Methods, parameters, returns, blocks, yield, proc/lambda, and forwarding"
points = 15
critical = true

[[categories]]
id = "rbs"
title = "RBS types, overloads, generics, substitution, and annotation checking"
points = 15
critical = true

[[categories]]
id = "cross_file"
title = "Constants, reopened definitions, cross-file propagation, and invalidation"
points = 10
critical = true

[[categories]]
id = "generated_runtime"
title = "Supported generated/framework/runtime facts, including Rails and JRuby"
points = 5
critical = true

[[categories]]
id = "lifecycle_parity"
title = "Lifecycle determinism, malformed code, CLI/LSP parity, and explanations"
points = 5
critical = true

