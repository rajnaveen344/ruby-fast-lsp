schema_version = 1
name = "Ruby Fast LSP type inference conformance"
corpus_revision = "m7-proof-first-callable-bodies-1"
score_eligible = true
target_score = 90
critical_category_minimum = 85
minimum_cases_for_claim = 50
notes = "M7 corpus with 121 reviewed cases. It adds parameter-dependent callable bodies for direct and higher-order calls, structural projection through callables, and stable escape invalidation controls on top of signature-driven explicit blocks, static symbol-to-proc, generic RBS yielding calls, and structural collection pipelines. Exact local Hash shapes, correlated joins, bounded alias mutation, escape invalidation, precise literal/dynamic keyed reads, explained field/depth bound failures, equality/inequality discriminators, ordinary case discriminators, and Hash-pattern captures are passing. Unknown splats, invalidated discriminators, incomplete unions, dynamic callables, unsupported block exits, and unsupported callable bodies remain fail-closed controls. Proven multiline chained-call inlays, embedded core runtime value constants, proof-checked deferred chained receivers and constructor origins, source-ordered owner isolation, exact local/nonlocal-read and call-expression proof outcomes, explicit parameter contracts through flow, exhaustive joins, deferred complete-graph finalization, visibility-complete dispatch, cross-file recursive return components, callable constant lifecycle replacement, and Unknown reassignment invalidation are covered. Differential CLI/LSP parity covers method returns, parameters, constants, local and nonlocal variable assignments, concrete and explained-Unknown variable reads and calls, proven chain expressions, higher-order and callable-body calls, deferred mixin dispatch, reopened dispatch, and cross-file recursive calls. Differential CLI/LSP diagnostic parity covers unresolved-method with suggestions, unresolved-constant, missing-kwarg, unmatched YARD parameters, YARD/RBS return conflicts, unresolved require, parser syntax errors, and deterministic multi-diagnostic order. Eligibility remains gated by the separate reviewed precision corpus and recorded deterministic performance/RSS evidence."

[[categories]]
id = "literals_collections"
title = "Literals, operators, interpolations, and collections"
points = 10
critical = true

[[categories]]
id = "locals_scopes_attributes"
title = "Locals, assignments, scopes, captured variables, and attributes"
points = 10
critical = true

[[categories]]
id = "flow"
title = "Branches, guards, pattern matching, rescue, loops, and reachability"
points = 15
critical = true

[[categories]]
id = "calls_dispatch"
title = "Calls, constructors, dispatch, visibility, MRO, mixins, and super"
points = 15
critical = true

[[categories]]
id = "methods_blocks"
title = "Methods, parameters, returns, blocks, yield, proc/lambda, and forwarding"
points = 15
critical = true

[[categories]]
id = "rbs"
title = "RBS types, overloads, generics, substitution, and annotation checking"
points = 15
critical = true

[[categories]]
id = "cross_file"
title = "Constants, reopened definitions, cross-file propagation, and invalidation"
points = 10
critical = true

[[categories]]
id = "generated_runtime"
title = "Supported generated/framework/runtime facts, including Rails and JRuby"
points = 5
critical = true

[[categories]]
id = "lifecycle_parity"
title = "Lifecycle determinism, malformed code, CLI/LSP parity, and explanations"
points = 5
critical = true

