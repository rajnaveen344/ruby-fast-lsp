[workspace]
members = [
    ".",
    "crates/rbs-parser",
    "crates/lsp-test-harness",
    "crates/jvm-metadata",
    "crates/jruby-support",
    "crates/ruby-analysis",
    "crates/extension-api",
    "crates/extension-guest-sdk",
    "crates/extension-rspec",
    "crates/extension-wasm-host",
    "extensions/example-rust",
    "extensions/sinatra-rust",
    "extensions/cucumber-rust",
    "extensions/minitest-ruby",
    "extensions/rails-ruby",
]
resolver = "2"

[package]
name = "ruby-fast-lsp"
version = "0.2.6"
edition = "2021"
authors = ["Ruby Fast LSP Team"]
description = "A fast Language Server Protocol implementation for Ruby"
license = "MIT"

[[bin]]
name = "profile_indexer"
path = "src/bin/profile_indexer.rs"

[[bin]]
name = "profile_project_collection"
path = "src/bin/profile_project_collection.rs"

[[bin]]
name = "profiler"
path = "src/bin/profiler/main.rs"

[[bin]]
name = "ast"
path = "src/bin/ast.rs"

[[bin]]
name = "bench_references"
path = "src/bin/bench_references.rs"

[[bin]]
name = "extension"
path = "src/bin/extension.rs"

[dependencies]
# LSP related dependencies
tower-lsp = "0.20.0"
tokio = { version = "1.32.0", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
serde_yaml = "0.9.34"
log = "0.4.20"
env_logger = "0.10.0"
anyhow = "1.0.75"
futures = "0.3"
toml = "0.9.8"
semver = "1.0.28"
sha2 = "0.10.9"
ruby-fast-lsp-extension-api = { path = "crates/extension-api" }
ruby-fast-lsp-extension-rspec = { path = "crates/extension-rspec" }
ruby-fast-lsp-extension-wasm-host = { path = "crates/extension-wasm-host" }
ruby-fast-lsp-jvm-metadata = { path = "crates/jvm-metadata" }
ruby-fast-lsp-jruby-support = { path = "crates/jruby-support" }

# Ruby parsing and analysis
ruby-prism = "1.4.0"
rbs-parser = { path = "crates/rbs-parser" }
ruby-analysis = { path = "crates/ruby-analysis" }

# File system operations
walkdir = "2.4.0"

# Utils
parking_lot = { version = "0.12.4", features = ["arc_lock"] }
postcard = { version = "1.1.3", features = ["alloc"] }
once_cell = "1.19"
unicode-ident = "1.0.18"
lazy_static = "1.4.0"
trie-rs = "0.4.2"
chrono = { version = "0.4.31", features = ["serde"] }
flate2 = "1.0.28"
fs2 = "0.4"
clap = { version = "4.4.0", features = ["derive"] }
regex = "1.10"
slotmap = "1.0"
ustr = "1.0"
dhat = "0.3.2"
rayon = "1.10"

# Perf corpus: tar.zst decode for bench/perf-test fixtures
tar = "0.4"
zstd = "0.13"
globset = "0.4"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

# Platform-specific dependencies for parent process monitoring
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
] }

[dev-dependencies]
tokio-test = "0.4.3"
pretty_assertions = "1.4.0"
tempfile = "3.8.0"
async-trait = "0.1.73"
wat = "1.248.0"
tower = { version = "0.4", features = ["util"] }

[build-dependencies]
cc = "1.0.83"
sha2 = "0.10.9"

[features]
default = []
memory-profiling = []

[profile.release]
opt-level = "z"
strip = "symbols"
debug = 0
