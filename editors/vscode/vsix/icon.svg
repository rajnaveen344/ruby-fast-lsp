<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a4c"/><stop offset="1" stop-color="#121320"/></linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <g transform="translate(128 130) scale(0.78) translate(-128 -128)">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fffbd6"/>
      <stop offset="0.3" stop-color="#ffe44f"/>
      <stop offset="1" stop-color="#ff9f0f"/>
    </linearGradient>
    <linearGradient id="crownL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a72"/><stop offset="1" stop-color="#e8283a"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9aa0"/><stop offset="1" stop-color="#ff4a56"/></linearGradient>
    <linearGradient id="crownM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d58"/><stop offset="1" stop-color="#d81c2c"/></linearGradient>
    <linearGradient id="crownR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e93444"/><stop offset="1" stop-color="#b4111f"/></linearGradient>
    <linearGradient id="pavL" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#ea2434"/><stop offset="1" stop-color="#a80d1b"/></linearGradient>
    <linearGradient id="pavM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cc1424"/><stop offset="1" stop-color="#860914"/></linearGradient>
    <linearGradient id="pavR" x1="1" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#a00c19"/><stop offset="1" stop-color="#5c040c"/></linearGradient>
    <polygon id="boltShape" points="156,20 86,142 124,142 94,240 182,110 142,110 188,20"/>
    <mask id="knock" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <use href="#boltShape" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g mask="url(#knock)">
    <g stroke="#ffd0d4" stroke-opacity="0.22" stroke-width="1.5" stroke-linejoin="round">
      <!-- crown -->
      <polygon points="18,100 74,48 100,100" fill="url(#crownL)"/>
      <polygon points="74,48 128,48 100,100" fill="url(#table)"/>
      <polygon points="100,100 128,48 156,100" fill="url(#crownM)"/>
      <polygon points="128,48 182,48 156,100" fill="url(#crownL)"/>
      <polygon points="156,100 182,48 238,100" fill="url(#crownR)"/>
      <!-- pavilion -->
      <polygon points="18,100 59,100 128,230" fill="url(#pavL)"/>
      <polygon points="59,100 100,100 128,230" fill="#d51a2a"/>
      <polygon points="100,100 156,100 128,230" fill="url(#pavM)"/>
      <polygon points="156,100 197,100 128,230" fill="#9a0b17"/>
      <polygon points="197,100 238,100 128,230" fill="url(#pavR)"/>
    </g>
    <!-- girdle highlight and table glint -->
    <path d="M22,100 H234" stroke="#ffb3b8" stroke-opacity="0.45" stroke-width="2"/>
    <polygon points="84,54 116,54 101,82" fill="#fff" opacity="0.45"/>
  </g>

  <!-- sparks -->
  <g stroke="#ffc21a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M212,30 l16,-14"/>
    <path d="M220,58 l22,-2"/>
    <path d="M56,226 l-16,14"/>
  </g>

  <use href="#boltShape" fill="url(#bolt)" stroke="#f08c00" stroke-width="3" stroke-linejoin="round"/>
  <!-- bolt bevel highlight -->
  <polyline points="160,26 94,138" stroke="#fffde8" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" fill="none"/>
</g>
</svg>
