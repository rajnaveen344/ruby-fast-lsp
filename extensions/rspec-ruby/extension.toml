id = "rspec-ruby"
name = "RSpec Ruby"
version = "0.1.0"
abi_version = 1
server_version = ">=0.2.3, <0.4.0"
runtime = "mruby-wasm"
entry = "extension.rb"
wasm = "target/wasm32-wasip1/release/rspec-ruby.wasm"
checksum_sha256 = "0b8f88884791077b42c78284dfbb845f5562c335ee00d657c9df23f479ef5329"
capabilities = ["index.call", "document_symbol", "code_lens"]
permissions = []

[applicability]
locked_gems = [{ name = "rspec-core", version = ">=3.0.0, <4.0.0" }]

[build]
output = "target/wasm32-wasip1/release/rspec-ruby.wasm"
# Build inputs of the checked-in Wasm; see crates/devtools/src/package_sources.rs.
source_sha256 = "1cfc25674fdfad430b44ce165c973effcf12d15818ec39c05bbbb7a91b852fad"

[indexing]
project_context = "activation"
call_names = ["describe", "context", "shared_context", "include_context", "shared_examples", "shared_examples_for", "include_examples", "it_behaves_like", "it_should_behave_like", "it", "example", "specify", "before", "after", "around", "let", "let!", "subject", "subject!", "include", "prepend", "extend"]

[[indexing.namespaces]]
owner = ["RSpec"]
declaration_kind = "module"

[[indexing.targets]]
owner = ["RSpec"]
owner_kind = "singleton"
method = "describe"
frame = true

[[indexing.targets]]
owner = ["RSpec"]
owner_kind = "singleton"
method = "shared_context"
frame = true

[[indexing.targets]]
owner = ["RSpec"]
owner_kind = "singleton"
method = "shared_examples"
frame = true

[[indexing.targets]]
owner = ["RSpec"]
owner_kind = "singleton"
method = "shared_examples_for"
frame = true
