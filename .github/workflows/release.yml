name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_extensions:
        description: "Publish the validated weekly extension to Marketplace and Open VSX"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ruby-fast-lsp-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            npm-pkg: darwin-arm64
            vsix-platform: darwin-arm64
            bin: ruby-fast-lsp

          - os: macos-15-intel
            target: x86_64-apple-darwin
            npm-pkg: darwin-x64
            vsix-platform: darwin-x64
            bin: ruby-fast-lsp

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm-pkg: linux-x64
            vsix-platform: linux-x64
            bin: ruby-fast-lsp

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            npm-pkg: linux-arm64
            vsix-platform: linux-arm64
            bin: ruby-fast-lsp

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm-pkg: win32-x64
            vsix-platform: win32-x64
            bin: ruby-fast-lsp.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate source versions and release tag
        shell: bash
        run: |
          node editors/check_package_versions.js
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            EXPECTED="v$(node -p 'require("./editors/npm/ruby-fast-lsp/package.json").version')"
            test "$GITHUB_REF_NAME" = "$EXPECTED"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --bin ruby-fast-lsp --target ${{ matrix.target }}

      - name: Test on native target
        run: cargo test --locked --workspace --target ${{ matrix.target }}

      - name: Copy binary to npm package
        shell: bash
        run: |
          mkdir -p editors/npm/${{ matrix.npm-pkg }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} editors/npm/${{ matrix.npm-pkg }}/bin/${{ matrix.bin }}
          chmod +x editors/npm/${{ matrix.npm-pkg }}/bin/${{ matrix.bin }}
          node editors/scripts/stage_package_assets.js npm editors/npm/${{ matrix.npm-pkg }}

      - name: Verify installed npm artifact
        run: node editors/scripts/smoke_npm_install.js

      - name: Copy binary to VSIX
        shell: bash
        run: |
          mkdir -p editors/vscode/vsix/bin/${{ matrix.vsix-platform }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} editors/vscode/vsix/bin/${{ matrix.vsix-platform }}/${{ matrix.bin }}

      - name: Upload npm artifact
        uses: actions/upload-artifact@v5
        with:
          name: npm-${{ matrix.npm-pkg }}
          path: editors/npm/${{ matrix.npm-pkg }}

      - name: Upload VSIX binary
        uses: actions/upload-artifact@v5
        with:
          name: vsix-bin-${{ matrix.vsix-platform }}
          path: editors/vscode/vsix/bin/${{ matrix.vsix-platform }}

  publish-npm:
    if: github.event_name == 'push'
    needs: [build, verify-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download all npm artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: npm-*
          path: artifacts

      - name: Prepare packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Resolve README symlink to real file (npm doesn't follow symlinks)
          if [ -L editors/npm/ruby-fast-lsp/README.md ]; then
            cp --remove-destination "$(readlink -f editors/npm/ruby-fast-lsp/README.md)" editors/npm/ruby-fast-lsp/README.md
          fi

          # Copy built binaries into npm package dirs
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cp -r artifacts/npm-${pkg}/* editors/npm/${pkg}/
          done

          # Sync version in all package.json files
          for pkg in ruby-fast-lsp darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" editors/npm/${pkg}/package.json
          done

          # Sync optionalDependencies versions
          for dep in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            sed -i "s|\"@ruby-fast/lsp-${dep}\": \".*\"|\"@ruby-fast/lsp-${dep}\": \"${VERSION}\"|" editors/npm/ruby-fast-lsp/package.json
          done

      - name: Publish platform packages
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            echo "Publishing @ruby-fast/lsp-${pkg}@${VERSION}..."
            (cd editors/npm/${pkg} && npm publish --access public)
          done

      - name: Publish main CLI package
        run: |
          echo "Publishing @ruby-fast/lsp@${VERSION}..."
          (cd editors/npm/ruby-fast-lsp && npm publish --access public)

  package-vsix:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      vsix-version: ${{ steps.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Add Wasm target to the pinned project toolchain
        run: rustup target add wasm32-wasip1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download all VSIX binaries
        uses: actions/download-artifact@v5
        with:
          pattern: vsix-bin-*
          path: editors/vscode/vsix/bin-artifacts

      - name: Prepare VSIX
        id: prepare
        run: |
          # VSIX uses CalVer: YYYY.WW.PATCH (e.g., 2026.14.0)
          YEAR=$(date -u +%G)
          WEEK=$(date -u +%-V)
          # Check if this year.week already exists, increment patch if so
          EXISTING=$(npx --yes @vscode/vsce@3.9.2 show naveenraj.ruby-fast-lsp --json 2>/dev/null | node -e "
            const d = require('fs').readFileSync('/dev/stdin','utf8');
            try {
              const v = JSON.parse(d).versions.map(v=>v.version);
              const matches = v.filter(x=>x.startsWith('${YEAR}.${WEEK}.'));
              if (matches.length) {
                const patches = matches.map(x=>parseInt(x.split('.')[2]));
                console.log(Math.max(...patches)+1);
              } else { console.log(0); }
            } catch(e) { console.error(e.message); process.exit(1); }
          ")
          VSIX_VERSION="${YEAR}.${WEEK}.${EXISTING}"
          echo "VSIX_VERSION=${VSIX_VERSION}" >> $GITHUB_ENV
          echo "version=${VSIX_VERSION}" >> $GITHUB_OUTPUT
          echo "VSIX version: ${VSIX_VERSION}"

          # Move binaries into place
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            mkdir -p editors/vscode/vsix/bin/${platform}
            cp -r editors/vscode/vsix/bin-artifacts/vsix-bin-${platform}/* editors/vscode/vsix/bin/${platform}/
          done
          rm -rf editors/vscode/vsix/bin-artifacts

          # Keep the CalVer package and lock metadata consistent before npm ci.
          VSIX_VERSION="$VSIX_VERSION" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VSIX_VERSION;
          for (const name of ['package.json', 'package-lock.json']) {
            const file = `editors/vscode/vsix/${name}`;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (data.packages) data.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE

          # Pre-zip stubs if script exists
          ./editors/scripts/zip_vscode_stubs.sh

      - name: Build and stage validated VSIX assets
        run: |
          extensions/sinatra-rust/build-and-test.sh
          extensions/cucumber-rust/build-and-test.sh
          extensions/minitest-ruby/build-and-test.sh
          extensions/rails-ruby/build-and-test.sh
          node editors/scripts/stage_package_assets.js vsix editors/vscode/vsix

      - name: Install VSIX dependencies
        run: |
          cd editors/vscode/vsix
          npm ci

      - name: Package VSIX
        run: |
          cd editors/vscode/vsix
          npx --yes @vscode/vsce@3.9.2 package

      - name: Upload VSIX package
        uses: actions/upload-artifact@v5
        with:
          name: vsix-package
          path: editors/vscode/vsix/ruby-fast-lsp-${{ steps.prepare.outputs.version }}.vsix

  verify-vsix:
    needs: package-vsix
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v5
        with:
          name: vsix-package
          path: artifacts
      - run: npm ci --prefix editors/vscode/vsix
      - name: Exercise the actual release archive
        shell: bash
        run: node editors/scripts/smoke_vsix.js "artifacts/ruby-fast-lsp-${{ needs.package-vsix.outputs.vsix-version }}.vsix"
      - name: Required bundled-extension stress
        if: runner.os == 'Linux'
        run: editors/scripts/stress_bundled_extensions.sh "artifacts/ruby-fast-lsp-${{ needs.package-vsix.outputs.vsix-version }}.vsix"

  publish-marketplace:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_extensions)
    needs: [package-vsix, verify-vsix]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download VSIX package
        uses: actions/download-artifact@v5
        with:
          name: vsix-package
          path: vsix

      - name: Publish to VS Code Marketplace
        working-directory: vsix
        run: |
          for attempt in 1 2 3; do
            if npx --yes @vscode/vsce@3.9.2 publish --packagePath "ruby-fast-lsp-${VSIX_VERSION}.vsix" -p ${{ secrets.VSCE_TOKEN }}; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "VS Code Marketplace publish failed; retrying in 60 seconds..."
            sleep 60
          done
        env:
          VSIX_VERSION: ${{ needs.package-vsix.outputs.vsix-version }}

  publish-open-vsx:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_extensions)
    needs: [package-vsix, verify-vsix]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download VSIX package
        uses: actions/download-artifact@v5
        with:
          name: vsix-package
          path: vsix

      - name: Publish to Open VSX
        working-directory: vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
          VSIX_VERSION: ${{ needs.package-vsix.outputs.vsix-version }}
        run: |
          # Documented Open VSX path: npx ovsx publish <file> with OVSX_PAT.
          for attempt in 1 2 3; do
            if npx --yes ovsx@1.1.1 publish "ruby-fast-lsp-${VSIX_VERSION}.vsix"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Open VSX publish failed; retrying in 60 seconds..."
            sleep 60
          done

  create-release:
    needs: [publish-npm, publish-marketplace, publish-open-vsx]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
