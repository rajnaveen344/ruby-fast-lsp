name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix editors/vscode/vsix
      - run: node editors/scripts/release_checks.js correctness
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: correctness-evidence
          path: target/release-evidence
          if-no-files-found: error
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIM_RANDOM_SEEDS: '10'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: node editors/scripts/release_checks.js simulation
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: simulation-evidence
          path: |
            target/release-evidence
            target/simulation-reliability/oracle-controls-*
            /tmp/ruby-fast-lsp-sim
            /tmp/ruby-lsp-schedule-*
          if-no-files-found: error
  simulation-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate fault classification and checkout isolation
        run: python3 -m unittest discover -s support/simulation -p 'test_fault_campaign.py' -v
      - name: Prove detection of the reviewed production faults
        run: python3 support/simulation/run_fault_campaign.py --run
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: simulation-fault-evidence
          path: target/simulation-reliability
          if-no-files-found: error
